name: Deploy

on:
  push:
    branches:
      - main
      - experiment
  workflow_dispatch:

env:
  IMAGE_NAME: marketing-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Login to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to DOCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to App Platform
        run: |
          # Update app spec with registry name
          sed "s/REGISTRY_NAME/${{ secrets.DO_REGISTRY_NAME }}/g" .do/app.yaml > /tmp/app-spec.yaml

          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | grep marketing-web | awk '{print $1}' || true)

          if [ -z "$APP_ID" ]; then
            doctl apps create --spec /tmp/app-spec.yaml
          else
            doctl apps update $APP_ID --spec /tmp/app-spec.yaml
          fi
