name: marketing-web
region: nyc
services:
  - name: web
    image:
      registry: ghcr.io
      repository: c8e-labs/marketing-web
      tag: latest
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    http_port: 8080
    routes:
      - path: /
    health_check:
      http_path: /
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
